model_list:
  # Havuzdaki Ücretsiz Uç Noktalar (Awesome FreeLLM havuzundan türetilmiştir)
  - model_name: free-pool-primary
    litellm_params:
      model: openai/meta-llama/llama-3.1-8b-instruct
      api_base: "https://api.freellm.net/v1" # Depodaki ana yönlendirici uç nokta
      api_key: "sk-or-v1-placeholder-veya-depodaki-anahtar"

  - model_name: free-pool-backup
    litellm_params:
      model: openai/google/gemma-2-9b-it
      api_base: "https://backup-api.freellm.net/v1"
      api_key: "sk-or-v1-placeholder-veya-depodaki-anahtar"

  # ==============================================================================
  # Google Gemini Free Tier Pool (Güvenli 14 RPM Limiti & Otomatik 429/Kota Fallback)
  # ==============================================================================
  - model_name: gemini-free-pool
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY_1"
      rpm: 14
      tpm: 1000000

  - model_name: gemini-free-pool-backup1
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY_2"
      rpm: 14
      tpm: 1000000

  - model_name: gemini-free-pool-backup2
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY_3"
      rpm: 14
      tpm: 1000000

router_settings:
  routing_strategy: "least-busy" # Boşta olan / en az yükteki anahtara otomatik yönlendirir
  fallbacks: 
    - {"free-pool-primary": ["free-pool-backup"]}
    - {"gemini-free-pool": ["gemini-free-pool-backup1", "gemini-free-pool-backup2"]}
  num_retries: 3
  timeout: 20
  cooldown_time: 65 # 429 veya kota aşımında anahtar 65 saniye bekletilir
  allowed_fails: 1

general_settings:
  master_key: "Eymen.1905-" # LibreChat'ten bu proxy'ye bağlanırken kullanacağın anahtar
