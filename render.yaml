# Render.com Blueprint Deployment Specification
# Repo: awesome-freellm-apis (Key Rotator & Rate Limiter)

services:
  - type: web
    name: freellm-api-rotator
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false # Comma-separated keys: key1,key2,key3
      - key: ROTATION_STRATEGY
        value: failover_on_error
